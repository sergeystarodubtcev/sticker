name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, "claude/quirky-bohr-nuyv2n"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp -r index.html app.css app.js sw.js manifest.webmanifest .nojekyll assets data _site/
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          printf '{"owner":"%s","repo":"%s","branch":"%s"}\n' "$OWNER" "$REPO" "$GITHUB_REF_NAME" > _site/data/config.json
          sed -i "s/var VERSION = 'v1'/var VERSION = '${GITHUB_SHA::8}'/" _site/sw.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
