name: Publish site to gh-pages

# Код сайта собирается из рабочей ветки и кладётся в gh-pages.
# База лотов (data/lots.json) живёт в gh-pages — её пишет само приложение,
# поэтому при публикации она НЕ перезатирается.
on:
  push:
    branches: [main, master, "claude/quirky-bohr-nuyv2n"]
    paths-ignore: ["data/lots.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: site }
        continue-on-error: true
      - name: Build
        run: |
          mkdir -p site/data
          if [ ! -f site/data/lots.json ]; then cp src/data/lots.json site/data/lots.json; fi
          cp -r src/index.html src/app.css src/app.js src/sw.js src/manifest.webmanifest src/.nojekyll src/assets site/
          printf '{"owner":"%s","repo":"%s","branch":"gh-pages"}\n' "${GITHUB_REPOSITORY%%/*}" "${GITHUB_REPOSITORY#*/}" > site/data/config.json
          sed -i "s/var VERSION = 'v1'/var VERSION = '${GITHUB_SHA::8}'/" site/sw.js
      - name: Push
        working-directory: site
        run: |
          [ -d .git ] || { git init -q -b gh-pages; git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"; }
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "Сайт: ${GITHUB_SHA::8}"
          git push origin HEAD:gh-pages
